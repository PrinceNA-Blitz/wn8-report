# Builds the report from live Wargaming API data, records the day's snapshot in
# data/, and deploys the page to GitHub Pages. Needs the repository secret
# WG_APPLICATION_ID. See README.md.
name: Build report

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC = 3:30 a.m. CST / 4:30 a.m. CDT
  workflow_dispatch:
    inputs:
      allow_decrease:
        description: "Record stats that went down as an anomaly instead of stopping"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hanging API call can cost about a minute; the build is usually 1-2
    env:
      WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
      WG_PUBLIC_APP_ID: ${{ secrets.WG_APPLICATION_ID }}
      ALLOW_DECREASE: ${{ inputs.allow_decrease && '1' || '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the application id secret
        run: |
          if [ -z "$WG_APPLICATION_ID" ]; then
            echo "::error::Add the WG_APPLICATION_ID repository secret"
            exit 1
          fi

      - name: Tests
        run: |
          python tests/test_site_data.py
          python tests/test_api_client.py
          python tests/make_parity_fixture.py --check
          node tests/wn8_parity.mjs

      - name: Build
        run: |
          python scripts/export_player_html.py Prince_NA --site --account-id 1009796686 \
            --out site/index.html --write-snapshot data --dump-parity build/parity.json

      - name: Check WN8 parity on today's data
        run: node tests/wn8_parity.mjs build/parity.json

      - name: Add the history file to the page
        run: mkdir -p site/data && cp data/history.jsonl site/data/

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No snapshot change."
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
